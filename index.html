<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlotData RTP Centre — 3 Scanners, 1 Platform</title>
    <meta name="description" content="Pilih scanner yang betul untuk anda. CyberSlot, TipsMega888, SlotPatcher — 3 scanners, 50+ providers, real-time RTP data." />
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['DM Serif Display', 'serif'],
              mono: ['JetBrains Mono', 'monospace'],
            },
            colors: {
              accent: {
                DEFAULT: '#FF3333',
                500: '#FF3333',
                600: '#e60000',
              },
              surface: {
                DEFAULT: '#0a0a0a',
                50: '#171717',
                100: '#1a1a1a',
              }
            },
            animation: {
              'pulse-slow': 'pulse-slow 4s ease-in-out infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              'pulse-slow': {
                '0%, 100%': { opacity: '0.03' },
                '50%': { opacity: '0.08' },
              },
              'float': {
                '0%, 100%': { transform: 'translateY(0px)' },
                '50%': { transform: 'translateY(-10px)' },
              },
            }
          }
        }
      }
    </script>
    <style>
      /* Smooth scroll */
      html { scroll-behavior: smooth; }

      /* Selection */
      ::selection {
        background: rgba(255, 51, 51, 0.3);
        color: white;
      }

      /* Noise overlay */
      .noise-bg::before {
        content: '';
        position: fixed;
        inset: 0;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
        pointer-events: none;
        z-index: 1;
      }

      /* Red glow effect */
      .glow-red {
        box-shadow: 0 0 40px rgba(255, 51, 51, 0.15), 0 0 80px rgba(255, 51, 51, 0.05);
      }

      /* Announcement pill */
      .pill-glow {
        box-shadow: 0 0 0 1px rgba(255, 51, 51, 0.2), 0 0 20px rgba(255, 51, 51, 0.05);
      }

      /* ── GLITCH TEXT ── */
      .glitch-text {
        position: relative;
      }
      .glitch-text:hover {
        animation: glitch-1 0.3s linear;
      }
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
      }
      .glitch-text::before {
        color: #0ff;
        z-index: -1;
      }
      .glitch-text::after {
        color: #f0f;
        z-index: -2;
      }
      .glitch-text:hover::before {
        animation: glitch-2 0.3s linear;
        opacity: 0.8;
      }
      .glitch-text:hover::after {
        animation: glitch-3 0.3s linear;
        opacity: 0.8;
      }

      @keyframes glitch-1 {
        0% { clip-path: inset(40% 0 61% 0); transform: translate(-2px, 2px); }
        20% { clip-path: inset(92% 0 1% 0); transform: translate(2px, -1px); }
        40% { clip-path: inset(43% 0 1% 0); transform: translate(-1px, 3px); }
        60% { clip-path: inset(25% 0 58% 0); transform: translate(3px, -2px); }
        80% { clip-path: inset(54% 0 7% 0); transform: translate(-3px, 1px); }
        100% { clip-path: inset(58% 0 43% 0); transform: translate(2px, -3px); }
      }
      @keyframes glitch-2 {
        0% { transform: translate(2px, 0); }
        25% { transform: translate(-2px, 0); }
        50% { transform: translate(1px, 0); }
        75% { transform: translate(-1px, 0); }
        100% { transform: translate(0, 0); }
      }
      @keyframes glitch-3 {
        0% { transform: translate(-2px, 0); }
        25% { transform: translate(2px, 0); }
        50% { transform: translate(-1px, 0); }
        75% { transform: translate(1px, 0); }
        100% { transform: translate(0, 0); }
      }

      /* ── HOLOGRAPHIC BORDER ── */
      .holo-border {
        position: absolute;
        inset: -1px;
        border-radius: inherit;
        background: conic-gradient(
          from var(--holo-angle, 0deg),
          transparent 0%,
          var(--holo-color, #FF3333) 10%,
          transparent 20%,
          transparent 80%,
          var(--holo-color, #FF3333) 90%,
          transparent 100%
        );
        opacity: 0;
        transition: opacity 0.3s;
        mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
        mask-composite: exclude;
        -webkit-mask-composite: xor;
        padding: 1px;
      }
      .group:hover .holo-border {
        opacity: 0.6;
        animation: holo-rotate 3s linear infinite;
      }
      @property --holo-angle {
        syntax: '<angle>';
        initial-value: 0deg;
        inherits: false;
      }
      @keyframes holo-rotate {
        to { --holo-angle: 360deg; }
      }

      /* ── SCAN LINE SWEEP (on-hover activation scan) ── */
      .scan-line-sweep {
        position: absolute;
        left: 0;
        right: 0;
        height: 90px;
        top: -90px;
        opacity: 0;
        pointer-events: none;
      }
      .group:hover .scan-line-sweep {
        animation: sweep 1.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes sweep {
        0%   { top: -90px; opacity: 0; }
        12%  { opacity: 1; }
        88%  { opacity: 1; }
        100% { top: 100%; opacity: 0; }
      }

      /* ── SCANNER GRID OVERLAY (fades in while hovering) ── */
      .scanner-grid-overlay {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transition: opacity 350ms ease-out;
        background-image:
          linear-gradient(var(--scan-grid-color, rgba(255,255,255,0.08)) 1px, transparent 1px),
          linear-gradient(90deg, var(--scan-grid-color, rgba(255,255,255,0.08)) 1px, transparent 1px);
        background-size: 22px 22px;
        mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 75%);
        -webkit-mask-image: radial-gradient(circle at 50% 40%, black 20%, transparent 75%);
      }
      .group:hover .scanner-grid-overlay {
        opacity: 0.9;
      }

      /* ── SCANNING INDICATOR BADGE ── */
      .scanning-indicator {
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 220ms ease-out, transform 220ms ease-out;
      }
      .group:hover .scanning-indicator {
        opacity: 1;
        transform: translateY(0);
      }
      .scanning-indicator .scan-dot {
        animation: scan-dot-pulse 900ms ease-in-out infinite;
      }
      @keyframes scan-dot-pulse {
        0%, 100% { opacity: 1; transform: scale(1); }
        50%      { opacity: 0.3; transform: scale(1.4); }
      }

      /* ── SCAN LINE SLOW (CTA section) ── */
      .scan-line-slow {
        position: absolute;
        left: 0;
        right: 0;
        height: 80px;
        animation: sweep-slow 5s ease-in-out infinite;
      }
      @keyframes sweep-slow {
        0% { top: -80px; }
        100% { top: 100%; }
      }

      /* ── NEON TEXT ── */
      .neon-text {
        text-shadow: 0 0 10px rgba(255, 51, 51, 0.3), 0 0 40px rgba(255, 51, 51, 0.1);
      }

      /* ── MAGNETIC BUTTON ── */
      .magnetic-btn {
        transition: transform 0.2s ease-out;
      }

      /* ── RIPPLE EFFECT ── */
      .ripple-effect {
        position: absolute;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        width: 100px;
        height: 100px;
        margin-top: -50px;
        margin-left: -50px;
        animation: ripple 0.6s linear;
        pointer-events: none;
      }
      @keyframes ripple {
        0% { transform: scale(0); opacity: 1; }
        100% { transform: scale(4); opacity: 0; }
      }

      /* ── HERO TITLE STAGGER ── */
      .hero-title {
        animation: hero-enter 1s ease-out 0.3s both;
      }
      @keyframes hero-enter {
        from {
          opacity: 0;
          transform: translateY(30px) scale(0.95);
          filter: blur(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
          filter: blur(0);
        }
      }

      /* ── FLOAT ANIMATION ── */
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }

      /* ── PULSE SLOW ── */
      @keyframes pulse-slow {
        0%, 100% { opacity: 0.03; }
        50% { opacity: 0.08; }
      }
      .animate-pulse-slow {
        animation: pulse-slow 4s ease-in-out infinite;
      }

      /* ── SCROLLBAR ── */
      ::-webkit-scrollbar { width: 6px; }
      ::-webkit-scrollbar-track { background: #0a0a0a; }
      ::-webkit-scrollbar-thumb { background: #1a1a1a; border-radius: 3px; }
      ::-webkit-scrollbar-thumb:hover { background: #FF3333; }
    </style>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",

    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
  <body class="bg-[#0a0a0a] text-white antialiased">
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
